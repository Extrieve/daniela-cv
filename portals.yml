# Portal Scanner — Daniela Ciñera
# Target: Lima, Perú — Entry-level / Junior roles in data, analytics, systems, IT, business admin

title_filter:
  positive:
    # -- Data & Analytics --
    - "Analista de Datos"
    - "Data Analyst"
    - "Business Analyst"
    - "Business Analytics"
    - "Analista de Negocio"
    - "Analista BI"
    - "Business Intelligence"
    - "Analista de Reportes"
    - "Reporting Analyst"
    - "Data Entry"
    - "Analista de Información"
    - "Analista de Inteligencia"
    # -- Systems & IT --
    - "Analista de Sistemas"
    - "Systems Analyst"
    - "Analista de TI"
    - "IT Analyst"
    - "Analista Funcional"
    - "Analista Programador"
    - "Soporte TI"
    - "Analista de Procesos"
    - "Process Analyst"
    - "Coordinador de Datos"
    - "Coordinador TI"
    - "Coordinador Tecnológico"
    - "Analista de Calidad"
    - "QA Analyst"
    # -- Business Admin & Operations --
    - "Administrador de Empresas"
    - "Asistente Administrativo"
    - "Coordinador Administrativo"
    - "Analista Administrativo"
    - "Asistente de Operaciones"
    - "Analista de Operaciones"
    - "Operations Analyst"
    - "Coordinador de Operaciones"
    - "Asistente de Gestión"
    - "Analista de Gestión"
    - "Back Office"
    - "Asistente de Proyectos"
    - "Analista de Proyectos"
    - "PMO"
    - "Asistente de Gerencia"
    - "Auxiliar Administrativo"
    # -- Commercial & Finance --
    - "Analista Comercial"
    - "Asistente Comercial"
    - "Analista de Planeamiento"
    - "Analista de Control de Gestión"
    - "Analista Financiero"
    - "Asistente Financiero"
    - "Analista de Costos"
    - "Analista de Presupuesto"
    - "Analista de Riesgos"
    # -- Entry-level explicit --
    - "Practicante"
    - "Trainee"
    - "Auxiliar"
  negative:
    - "Gerente General"
    - "Country Manager"
    - "Senior Manager"
    - "Director General"
    - "Director de"
    - "Jefe de"
    - "Head of"
    - "VP "
    - "Chief "
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Mainframe"
    - "COBOL"
    - "SAP MM"
    - "Oracle EBS"
    - "Obrero"
    - "Operario"
    - "Técnico en Redes"
  seniority_boost:
    - "Junior"
    - "Trainee"
    - "Practicante"
    - "Entry Level"
    - "Recién Egresado"
    - "Recién Egresada"
    - "Asistente"
    - "Auxiliar"

search_queries:

  # ── LinkedIn ──────────────────────────────────────────────────────────────
  - name: LinkedIn — Analista de Datos Lima
    query: "site:linkedin.com/jobs \"Analista de Datos\" OR \"Data Analyst\" Lima Perú junior OR egresado"
    enabled: true

  - name: LinkedIn — Business Analyst Lima
    query: "site:linkedin.com/jobs \"Business Analyst\" OR \"Analista de Negocio\" Lima Perú junior"
    enabled: true

  - name: LinkedIn — Analista de Sistemas Lima
    query: "site:linkedin.com/jobs \"Analista de Sistemas\" OR \"Systems Analyst\" Lima Perú junior OR egresado"
    enabled: true

  - name: LinkedIn — BI y Reportes Lima
    query: "site:linkedin.com/jobs \"Analista BI\" OR \"Business Intelligence\" OR \"Analista de Reportes\" Lima Perú"
    enabled: true

  - name: LinkedIn — IT y Funcional Lima
    query: "site:linkedin.com/jobs \"Analista TI\" OR \"Analista Funcional\" OR \"Soporte TI\" Lima Perú junior OR asistente"
    enabled: true

  - name: LinkedIn — Admin y Coordinación Lima
